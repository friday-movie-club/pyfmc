[project]
name = "python-fmc"
version = "1.2.0"
description = "Python client for the Friday Movie Club API"
readme = "README.md"
authors = [
    { name = "Andrew Bates", email = "358901+abates@users.noreply.github.com" },
]
requires-python = ">=3.12"
dependencies = ["httpx>=0.28.1", "pydantic>=2.12.5"]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fmc"
module-root = ""

[dependency-groups]
dev = ["ruff>=0.15.5"]

[tool.ruff]
# Allow lines to be as long as 120.
line-length = 120

[tool.ruff.lint]
select = ["F401"]
fixable = ["F401"]
